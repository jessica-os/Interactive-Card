<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Card</title>

    <link rel="shortcut icon" href="./src/imagens/favicon-32x32.png" type="image/x-icon" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&display=swap" />
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="./src/css/variaveis.css" />
    <link rel="stylesheet" href="./src/css/estilo.css" />
    <link rel="stylesheet" href="./src/css/responsivo.css" />
  </head>

  <body>
    <div class="bg-image" aria-hidden="true"></div>

    <main class="container">
      <section class="cards" aria-label="Cartões de visualização">
        <div class="front-card">
          <img
            class="image-front-card"
            src="./src/imagens/bg-card-front.png"
            alt="Imagem frente do cartão"
          />
          <div class="details-card1">
            <img class="logo" src="./src/imagens/card-logo.svg" alt="Logo do cartão" />
            <span class="card-number" aria-label="Número do cartão">0000 0000 0000 0000</span>
            <div class="info">
              <span class="card-name" aria-label="Nome no cartão">JANE APPLESEED</span>
              <div class="exp-date" aria-label="Data de expiração">
                <span class="card-month">00</span><span class="space">/</span><span class="card-year">00</span>
              </div>
            </div>
          </div>
        </div>

        <div class="back-card">
          <img class="image-back-card" src="./src/imagens/bg-card-back.png" alt="Imagem verso do cartão" />
          <div class="details-card2">
            <span class="card-cvc" aria-label="Código de segurança">000</span>
          </div>
        </div>
      </section>

      <form method="post" class="form" id="form" novalidate aria-label="Formulário de dados do cartão">
        <div class="input-item">
          <label for="name">Cardholder Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="e.g. Jane Appleseed"
            required
          />
          <span class="name-error" aria-live="polite">Can't be blank</span>
        </div>

        <div class="input-item">
          <label for="number">Card Number</label>
          <input
            type="tel"
            id="number"
            name="number"
            placeholder="e.g. 1234 5678 9123 0000"
            maxlength="16"
            pattern="\d{16}"
            inputmode="numeric"
            required
          />
          <span class="number-error" aria-live="polite">Wrong format, numbers only and 16 digits</span>
        </div>

        <div class="input-date">
          <div class="input-item">
            <label for="month">Exp. Date (MM)</label>
            <input
              type="text"
              id="month"
              name="month"
              placeholder="MM"
              maxlength="2"
              pattern="\d{2}"
              inputmode="numeric"
              required
            />
            <span class="month-error" aria-live="polite">Can't be blank</span>
          </div>

          <div class="input-item">
            <label for="year">Exp. Date (YY)</label>
            <input
              type="text"
              id="year"
              name="year"
              placeholder="YY"
              maxlength="2"
              pattern="\d{2}"
              inputmode="numeric"
              required
            />
          </div>

          <div class="input-item">
            <label for="cvc">CVC</label>
            <input
              type="text"
              id="cvc"
              name="cvc"
              placeholder="e.g. 123"
              maxlength="3"
              pattern="\d{3}"
              inputmode="numeric"
              required
            />
            <span class="cvc-error" aria-live="polite">Can't be blank</span>
          </div>
        </div>

        <button type="submit" class="confirm-button" id="confirm-button">Confirm</button>
      </form>

      <section class="thank" aria-label="Mensagem de confirmação" hidden>
        <img src="./src/imagens/icon-completed.svg" alt="Ícone de confirmação" />
        <h3>Thank You!</h3>
        <p>We've added your details</p>
        <button class="continue-button" id="continue-button">Continue</button>
      </section>
    </main>

    <script src="./src/js/index.js"></script>
  </body>
</html>
